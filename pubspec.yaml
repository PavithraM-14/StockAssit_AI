name: stock_market_analysis
description: StockSense - AI-powered stock analysis and signals app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  
  # HTTP & API
  dio: ^5.5.0+1
  http: ^1.2.2
  
  # State Management  
  provider: ^6.1.2
  
  # UI Components
  cupertino_icons: ^1.0.8
  
  # Charts (if needed for stock visualizations)
  fl_chart: ^0.69.0
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Uncomment and add assets if you have any
  # assets:
  #   - assets/images/
  #   - assets/icons/

